version: 1
services:
  - id: playtest-report
    name: Game Playtest AI
    stage: active
    problem: Detect player friction and turn it into traceable, actionable playtest findings.
    related_repo: madowaku/mado-game-experience-loop
    milestone: MGSF-M0.2
    entrypoint: mgsf playtest-report
    eval: evals/playtest-report.yaml
    service_contract: services/active/playtest-report/SERVICE.md
    dogfood:
      repository: madowaku/vertical-slice
      evidence_class: real_project_headless_test
      status: PASS

  - id: gameplay-capture
    name: Gameplay Evidence Capture
    stage: active
    problem: Preserve screenshots, video, and input/result timing as integrity-checked gameplay evidence.
    milestone: MGSF-M0.3b
    entrypoint: mgsf gameplay-capture
    adapter_entrypoint: mgsf godot-capture
    eval: evals/gameplay-capture.yaml
    service_contract: services/active/gameplay-capture/SERVICE.md
    dogfood:
      repository: madowaku/vertical-slice
      evidence_class: recorded_gameplay_capture
      status: PASS

  - id: quic-transport-probe
    name: QUIC Transport Probe / Network Evidence Harness
    stage: incubation
    problem: Compare game transport packet shape and latency with provenance-safe evidence before adopting QUIC.
    milestone: MGSF-M0.5
    entrypoint: mgsf transport-probe
    service_contract: docs/MGSF_M0_5_QUIC_TRANSPORT_PROBE.md
    evidence:
      fixture: deterministic_transport_fixture
      live_required_for_promotion: true

  - id: edenspark-agent-adapter
    name: EdenSpark Agent-Native Engine Adapter
    stage: incubation
    problem: Turn a game hypothesis into a recorded Codex plus EdenSpark MCP implementation and playtest evidence loop.
    milestone: MGSF-M0.6
    entrypoint: mgsf edenspark-plan
    eval_entrypoint: mgsf edenspark-eval
    service_contract: docs/MGSF_M0_6_TO_M0_8_EDENSPARK_PROTOTYPE_LOOP.md
    evidence:
      fixture: deterministic_edenspark_fixture
      live: recorded_edenspark_agent_mcp_run
      live_required_for_promotion: true

  - id: edenspark-autonomous-playtest
    name: EdenSpark Autonomous Playtest Loop
    stage: incubation
    problem: Iterate a Codex-driven EdenSpark prototype until observable gameplay criteria pass or the retry budget is exhausted.
    milestone: MGSF-M0.7
    entrypoint: mgsf edenspark-loop
    service_contract: docs/MGSF_M0_6_TO_M0_8_EDENSPARK_PROTOTYPE_LOOP.md

  - id: prototype-promotion-gate
    name: Prototype Promotion Gate
    stage: incubation
    problem: Promote prototype implementations from evidence instead of agent self-report or fixture success.
    milestone: MGSF-M0.8
    entrypoint: mgsf prototype-promote
    service_contract: docs/MGSF_M0_6_TO_M0_8_EDENSPARK_PROTOTYPE_LOOP.md

  - id: godogen-adapter
    name: Godogen Intake / Autonomous Game Build & Visual Proof Bridge
    stage: incubation
    problem: Safely stage a pinned Codex/Godot generator and gate autonomous game proof on recorded runner, actual engine probes, and inspected video.
    milestone: MGSF-M0.9
    entrypoint: mgsf godogen-intake
    eval_entrypoint: mgsf godogen-eval
    loop_entrypoint: mgsf godogen-loop
    service_contract: docs/MGSF_M0_9_GODOGEN_BRIDGE.md
    upstream: htdt/godogen
    evidence:
      fixture: deterministic_godogen_fixture
      live: recorded_godogen_codex_run
      live_required_for_promotion: true
      status: HOLD

  - id: godogen-gameplay-state-verification
    name: Godogen Live Dogfood / Gameplay State Verification
    stage: incubation
    problem: Check real Godot input-to-state movement with a replay trace, recorded movie, and independent engine runner hashes without confusing a hand-authored dogfood game with Codex generation.
    milestone: MGSF-M0.9.1
    entrypoint: mgsf godogen-state-dogfood
    eval_entrypoint: mgsf godogen-state-verify
    service_contract: docs/MGSF_M0_9_1_GODOGEN_LIVE_STATE_VERIFICATION.md
    evidence:
      fixture: deterministic_state_fixture
      live: recorded_godot_engine_dogfood
      live_required_for_promotion: true
      autonomous_proof: HOLD

  - id: godogen-state-to-frame-proof
    name: Godogen Autonomous Generation / State-to-Frame Proof Gate
    stage: incubation
    problem: Independently compare decoded gameplay video pixels with timed engine state, then require pinned Godogen and recorded Codex source provenance before autonomous promotion.
    milestone: MGSF-M0.9.2
    entrypoint: mgsf godogen-frame-proof
    generated_capture_entrypoint: mgsf godogen-generated-capture
    autonomy_gate_entrypoint: mgsf godogen-autonomy-gate
    service_contract: docs/MGSF_M0_9_2_AUTONOMOUS_GENERATION_FRAME_PROOF.md
    evidence:
      fixture: deterministic_frame_fixture
      real_engine: recorded_gameplay_frame_probe
      autonomous: local_codex_godogen_cross_run
      autonomous_proof: HOLD
      live_codex_required_for_promotion: true

  - id: godogen-real-autonomy-qualification
    name: Real Codex Generation Dogfood / End-to-End Autonomy Qualification
    stage: incubation
    problem: Orchestrate a real pinned Godogen intake, Codex game construction, separate Godot state/movie replay, pixel proof and provenance-based autonomy decision without confusing fixtures for live AI runs.
    milestone: MGSF-M0.9.3
    entrypoint: mgsf godogen-real-qualify
    service_contract: docs/MGSF_M0_9_3_REAL_CODEX_AUTONOMY_QUALIFICATION.md
    evidence:
      preflight: local_toolchain_availability
      live: recorded_codex_godogen_e2e_qualification
      default_status: HOLD
      real_codex_required_for_promotion: true
      no_credentialed_github_ci: true

  - id: build-doctor
    name: Game Build Doctor
    stage: candidate
    problem: Diagnose common Unity and Godot project startup, configuration, and dependency failures.

  - id: asset-forge
    name: Game Asset Forge
    stage: candidate
    problem: Produce coherent, reusable game asset sets from a compact art direction brief.

  - id: tutorial-doctor
    name: Tutorial Doctor
    stage: candidate
    problem: Detect where first-time players become confused or blocked.

  - id: release-doctor
    name: Release Doctor
    stage: candidate
    problem: Run evidence-backed pre-release checks for game projects.
