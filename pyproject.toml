[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mado-game-service-factory"
version = "0.1.0"
description = "Evidence-backed factory for small game-development services"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mgsf = "mgsf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mgsf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
