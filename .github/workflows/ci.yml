name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout vertical-slice capture target
        uses: actions/checkout@v4
        with:
          repository: madowaku/vertical-slice
          ref: f0514229d7f2036ec25646d09e3647c8d870dadb
          path: vendor/vertical-slice

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e ".[dev]"

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Ensure Xvfb
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - run: mgsf validate-catalog
      - name: Verify weight-space policy fixture and HOLD gate
        shell: bash
        run: |
          set -euo pipefail
          mgsf weight-space-eval \
            fixtures/weight-space/gridworld-v1.json \
            --output-root ci-evidence/weight-space
          grep -q '"status": "HOLD"' ci-evidence/weight-space/weight-space-game-ai-evidence.json

      - name: Verify neural behavior heldout contract and HOLD gate
        shell: bash
        run: |
          set -euo pipefail
          mgsf neural-behavior-eval \
            fixtures/weight-space/gridworld-v1.json \
            --seed 20261103 --count 40 \
            --output-root ci-evidence/neural-behavior
          grep -q '"status": "HOLD"' ci-evidence/neural-behavior/neural-behavior-evidence.json
          grep -q '"execution_status": "not_executed"' ci-evidence/neural-behavior/godot-handoff.json

      - name: Run real Godot neural agent and verify direct evidence
        shell: bash
        run: |
          set -euo pipefail
          mgsf godot-neural-bridge \
            ci-evidence/neural-behavior/godot-handoff.json \
            --project fixtures/godot-neural-bridge \
            --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --xvfb --count 6 --output-root ci-evidence
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path("ci-evidence/godot-neural-bridge/godot-neural-bridge-evidence.json").read_text())
          assert evidence["status"] == "PASS", evidence["errors"]
          assert evidence["matched_episodes"] == 6
          assert evidence["production_game_measurement"] is False
          assert evidence["screenshots_are_direct_godot_viewport_capture"] is True
          assert evidence["promotion_gate"]["status"] == "HOLD"
          assert evidence["artifacts"]["before.png"]["sha256"] != evidence["artifacts"]["after.png"]["sha256"]
          print("PASS: 6 Godot traces match Python and two distinct Godot viewport PNGs are present")
          PY

      - run: mgsf playtest-report fixtures/playtest-report/mgel-session-001 --output-root ci-evidence
      - run: mgsf dogfood-playtest-report dogfood/vertical-slice-c6-near-miss/record.json dogfood/vertical-slice-c6-near-miss/runtime_log.txt --output-root ci-evidence
      - run: mgsf gameplay-capture fixtures/gameplay-capture/vertical-slice-reconstruction --output-root ci-evidence
      - run: mgsf capture-playtest-report fixtures/gameplay-capture/vertical-slice-reconstruction --output-root ci-evidence

      - name: Exercise EdenSpark mission and fixture evidence contract
        shell: bash
        run: |
          set -euo pipefail
          mgsf edenspark-plan fixtures/edenspark/mission-neon-001.json --output-root ci-evidence/edenspark-missions
          mgsf edenspark-eval \
            fixtures/edenspark \
            fixtures/edenspark/mission-neon-001.json \
            fixtures/edenspark/fixture-run/result.json \
            --fixture \
            --output-root ci-evidence/edenspark
          mgsf prototype-promote \
            ci-evidence/edenspark/neon-risk-loop-001/iteration-1 \
            --output-root ci-evidence/prototype-promotion
          grep -q '"status": "HOLD"' ci-evidence/prototype-promotion/neon-risk-loop-001/promotion-decision.json

      - name: Capture real Godot gameplay frames
        run: >-
          mgsf godot-capture
          vendor/vertical-slice
          --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          --xvfb
          --source-sha f0514229d7f2036ec25646d09e3647c8d870dadb
          --output-root ci-evidence

      - name: Summarize direct capture evidence
        shell: bash
        run: |
          set -euo pipefail
          cat ci-evidence/godot-capture-adapter/vertical-slice-c6-direct/adapter_eval.json
          sha256sum ci-evidence/godot-capture-adapter/vertical-slice-c6-direct/raw-capture/*.png
          file ci-evidence/godot-capture-adapter/vertical-slice-c6-direct/raw-capture/*.png

      - run: pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: mgsf-evidence-${{ github.sha }}
          path: ci-evidence/
          retention-days: 14
