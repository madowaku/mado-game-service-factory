name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: mgsf validate-catalog
      - run: mgsf playtest-report fixtures/playtest-report/mgel-session-001 --output-root ci-evidence
      - run: mgsf dogfood-playtest-report dogfood/vertical-slice-c6-near-miss/record.json dogfood/vertical-slice-c6-near-miss/runtime_log.txt --output-root ci-evidence
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: mgsf-evidence-${{ github.sha }}
          path: ci-evidence/
          retention-days: 14
