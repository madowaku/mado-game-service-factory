name: godogen-live-state

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/godogen-live-state.yml"
      - "src/mgsf/godogen_state_verification.py"
      - "src/mgsf/godogen_adapter.py"
      - "src/mgsf/cli.py"
      - "fixtures/godogen/**"
      - "tests/test_godogen_state_verification.py"
      - "src/mgsf/godogen_frame_proof.py"
      - "src/mgsf/godogen_generation_proof.py"
      - "src/mgsf/godogen_source_fingerprint.py"
      - "tests/test_godogen_frame_proof.py"

permissions:
  contents: read

jobs:
  gyro-real-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install test and capture dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg libgl1 libglu1-mesa

      - name: Install actual Godot 4.7.2 .NET engine
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/godot-mono.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          unzip -q /tmp/godot-mono.zip -d /tmp/godot-mono
          GODOT="$(find /tmp/godot-mono -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' | head -1)"
          test -n "$GODOT"
          test -d "$(dirname "$GODOT")/GodotSharp"
          chmod +x "$GODOT"
          "$GODOT" --version
          printf 'GODOT_MONO=%s\n' "$GODOT" >> "$GITHUB_ENV"

      - name: Execute a real Godot input-to-state + video run
        shell: bash
        run: |
          set -euo pipefail
          mgsf godogen-state-dogfood \
            fixtures/godogen/gyro-live \
            fixtures/godogen/mission-gyro-live.json \
            --execute --godot "$GODOT_MONO" \
            --output-root ci-evidence/godogen-live-state

      - name: Validate provenance separation and signed input checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          results = list(Path("ci-evidence/godogen-live-state").glob("*/live-*/state-evaluation.json"))
          assert len(results) == 1, results
          data = json.loads(results[0].read_text(encoding="utf-8"))
          assert data["status"] == "PASS", data
          assert data["autonomous_status"] == "HOLD", data
          assert data["runner_verified"] is True
          assert data["video_verified"] is True
          assert data["state_trace"]["samples"] >= 20
          assert len(data["checks"]) == 3 and all(check["pass"] for check in data["checks"])
          print("real Godot engine gameplay state PASS; Godogen autonomous proof HOLD")
          PY

      - name: Decode real movie frames and independently verify state-to-frame
        shell: bash
        run: |
          set -euo pipefail
          state_file="$(find ci-evidence/godogen-live-state -name state-evaluation.json -type f | head -1)"
          test -n "$state_file"
          mgsf godogen-frame-proof             fixtures/godogen/gyro-live fixtures/godogen/mission-gyro-live.json             --trace screenshots/state-trace.json             --video screenshots/proof.mp4             --state-evidence "$state_file"             --output-root ci-evidence/godogen-live-state
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = list(Path("ci-evidence/godogen-live-state").glob("*/live-*/frame-proof.json"))
          assert len(evidence) == 1, evidence
          frame = json.loads(evidence[0].read_text(encoding="utf-8"))
          assert frame["status"] == "PASS", frame
          assert frame["autonomous_status"] == "HOLD", frame
          assert len(frame["checks"]) == 5 and all(item["pass"] for item in frame["checks"])
          print("independent decoded state-to-frame proof PASS 5/5; autonomy HOLD")
          PY

      - name: Run verifier contract tests
        run: pytest -q tests/test_godogen_state_verification.py tests/test_godogen_frame_proof.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mgsf-gyro-live-state
          path: ci-evidence/godogen-live-state/
          retention-days: 14
